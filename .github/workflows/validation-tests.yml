name: Migration Validation Tests

"on":
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
         - name: Run migration validation unit tests
      run: python -m unittest -v test_validate_migration.py
      working-directory: examples

    - name: Compare committed source and target CSV files
      run: python validate_migration.py
      working-directory: examples
      continue-on-error: true
